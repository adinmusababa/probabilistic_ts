dataset:
    name: ETTh1
    target: OT

window:
  context_length: 96 # nilai default awal
  prediction_length: 24 # nilai default awal

model:
  d_model: 64
  encoder_layers: 2
  decoder_layers: 2
  attention_heads: 4

training:
  batch_size: 32
  epochs: 20
  learning_rate: 0.0001

adapt_z:
  enabled: true
  learning_rate: 0.0001
  adaption_frequency: 1

evaluation:
  confidence_level: 0.95

reproducibility:
  seed: 42

  